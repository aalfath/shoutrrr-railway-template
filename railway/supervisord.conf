; Shoutrrr on Railway: web server, queue worker and scheduler in one container.
; Based on upstream docker/supervisord.conf (v1.5.9). Differences: Octane listens
; on $PORT with a worker count sized from the service's CPU and memory limits,
; and a FATAL program stops supervisord so the container exits non-zero.
[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/fd/1
logfile_maxbytes=0
loglevel=warn

[program:octane]
command=/bin/bash -c 'exec php /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --port="${PORT:-8080}" --workers="${OCTANE_WORKERS:-2}" --max-requests=500'
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker]
command=/usr/local/bin/worker-command.sh
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:schedule]
command=/bin/bash -c 'exec php /var/www/html/artisan schedule:work'
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[eventlistener:fatal]
command=/usr/local/bin/supervisor-fatal
events=PROCESS_STATE_FATAL
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
